<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Projects</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="user-profile">
            <!-- User PFP and name will be inserted here by JS -->
        </div>
    </header>

    <main>
        <div id="projects-grid">
            <!-- Project cards will be inserted here -->
        </div>
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <span>Loading more projects...</span>
        </div>
    </main>

    <div id="iframe-modal" class="hidden">
        <button id="close-iframe">&times;</button>
        <iframe id="project-iframe" src="" frameborder="0" allow="fullscreen"></iframe>
    </div>

    <script type="module" src="script.js"></script>

</html>
